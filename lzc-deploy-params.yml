params:
  - id: admin_username
    type: string
    name: Web UI username
    description: "Username to protect the Kestra web UI."
    default_value: "admin"
    optional: false
  - id: admin_password
    type: secret
    name: Web UI password
    description: "Password to protect the Kestra web UI, at least 12 characters."
    default_value: "$random(len=20)"
    optional: false
locales:
  zh:
    admin_username:
      name: 界面用户名
      description: 用于保护 Kestra 网页界面的用户名。
    admin_password:
      name: 界面密码
      description: 用于保护 Kestra 网页界面的密码，至少 12 位。默认随机生成，不存在内置弱口令。
