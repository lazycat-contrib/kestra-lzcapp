name: Build Kestra LPK
on:
  workflow_dispatch:
    inputs:
      version:
        description: '指定版本发布（如 2.0.11）；留空检查上游更新'
        type: string
        required: false
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: kestra-lpk
  cancel-in-progress: false
jobs:
  lazycat:
    uses: ca-x/lazycat-github-action/.github/workflows/lazycat.yml@v1
    with:
      operation: auto
      config: .github/lazycat-action.yml
      version: ${{ inputs.version || '' }}
      versioned-release-asset: true
    secrets:
      LZC_API_TOKEN: ${{ secrets.LZC_API_TOKEN }}
      APPSTORE_URL: ${{ secrets.APPSTORE_URL }}
      APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
      APP_ID: ${{ secrets.APP_ID }}
      PRIVATE_STORE_GROUP_CODES: ${{ secrets.PRIVATE_STORE_GROUP_CODES }}
